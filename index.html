<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Resident Evil 30 años</title>
    <!-- Pide a los buscadores que no indexen la página ni sigan sus enlaces -->
    <meta name="robots" content="noindex, nofollow, noimageindex" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600&family=Special+Elite&display=swap"
    />
    <link rel="stylesheet" href="estilos.css" />
  </head>

  <body>
    <section class="cover" id="cover" aria-label="Portada">
      <img
        class="cover-img"
        src="Images/img_main.jpg"
        alt="Ilustración de Leon S. Kennedy, Claire Redfield, Chris Redfield, Jill Valentine, Grace Ashcroft y Ada Wong"
      />
      <div class="cover-content">
        <div class="cover-kicker">30 aniversario · 1996 — 2026</div>
        <h1 class="cover-title" id="coverTitle"></h1>
        <p class="cover-sub" id="coverSub"></p>
        <div class="cover-actions">
          <button class="cover-start" id="start">Comenzar →</button>
          <span class="hint">o pulsa <kbd>Espacio</kbd></span>
        </div>
      </div>
    </section>

    <div class="app">
      <header>
        <h1 class="deck-title" id="deckTitle"></h1>
        <span class="counter" id="counter"></span>
      </header>

      <section class="stage" aria-live="polite">
        <div class="slide" id="slide">
          <article class="card" id="card">
            <div class="era" id="era"></div>
            <div class="year" id="year"></div>
            <div class="year-slot" id="yearSlot" hidden></div>
            <h2 class="ev-title" id="evTitle"></h2>
            <p class="ev-text" id="evText"></p>
            <dl class="facts" id="facts" hidden></dl>
          </article>
          <figure class="media" id="media" hidden>
            <div class="gallery" id="gallery"></div>
          </figure>
        </div>
      </section>

      <div class="viewport" id="viewport">
        <div class="track" id="track"></div>
        <div class="cursor"></div>
      </div>

      <div>
        <div class="progress" aria-hidden="true"><i id="bar"></i></div>
        <div class="controls">
          <div class="btns">
            <button class="ctl" id="prev" aria-label="Evento anterior">
              ← Anterior
            </button>
            <button class="ctl" id="next" aria-label="Evento siguiente">
              Siguiente →
            </button>
          </div>
          <button class="ctl" id="fs">Pantalla completa</button>
        </div>
      </div>
    </div>

    <script src="eventos.js"></script>
    <script src="app.js"></script>
  </body>
</html>
